name: Nightly data pipeline

# Refreshes /data from Coursedog and Hyperschedule, validates it, and opens a
# pull request when anything changed. It NEVER pushes to main: every data change
# is reviewed, because a bad catalog silently changes what the app tells a
# student they still need to take.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the pipeline
        id: pipeline
        env:
          COURSEDOG_CATALOG_ID: eziiW38FfLsoDlBqEZgV
          COURSEDOG_ORIGIN: https://catalog.pomona.edu
          HYPERSCHEDULE_BASE_URL: https://banana.hyperschedule.io
          PIPELINE_TERMS: FA2026,SP2027
        run: npm run pipeline:all

      # Only reached when pipeline:all succeeded, so a failed run leaves
      # yesterday's committed data in place and opens no PR.
      # Every artefact carries a fresh generatedAt/fetchedAt/lastVerified on every
      # run, so `git status data/` is ALWAYS dirty. Opening a PR on that would mean
      # a PR every single night with no course change in it, which is how people
      # learn to ignore the automation. Compare the artefacts with those volatile
      # provenance fields stripped, and only raise a PR when the DATA moved.
      - name: Detect substantive changes
        id: diff
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            import { readFileSync, existsSync, appendFileSync } from "node:fs";

            const VOLATILE = new Set(["generatedAt", "fetchedAt", "lastVerified"]);
            const strip = (v) => {
              if (Array.isArray(v)) return v.map(strip);
              if (v && typeof v === "object") {
                return Object.fromEntries(
                  Object.entries(v).filter(([k]) => !VOLATILE.has(k)).map(([k, x]) => [k, strip(x)]),
                );
              }
              return v;
            };
            const canonical = (text) => JSON.stringify(strip(JSON.parse(text)));

            const files = execSync("git status --porcelain data/", { encoding: "utf8" })
              .split("\n").map((l) => l.slice(3).trim()).filter(Boolean);

            const substantive = [];
            for (const f of files) {
              if (!f.endsWith(".json")) { substantive.push(f); continue; }   // reports/*.md etc.
              if (!existsSync(f)) { substantive.push(f); continue; }         // deleted
              let committed;
              try { committed = execSync(`git show HEAD:${f}`, { encoding: "utf8", maxBuffer: 1 << 30 }); }
              catch { substantive.push(f); continue; }                       // newly added
              try {
                if (canonical(committed) !== canonical(readFileSync(f, "utf8"))) substantive.push(f);
              } catch { substantive.push(f); }                               // unparseable: treat as changed
            }

            console.log(`changed files: ${files.length}, substantive: ${substantive.length}`);
            for (const f of substantive) console.log(`  substantive: ${f}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `changed=${substantive.length > 0}\n`);
          '

      - name: Summarise the validation report
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<PR_BODY_EOF'
            echo '## Nightly data refresh'
            echo
            echo '| Check | Status | Count | Summary |'
            echo '|---|---|---|---|'
            node -e '
              const r = require("./data/reports/validation.json");
              for (const c of r.checks) {
                console.log(`| ${c.id} | ${c.status} | ${c.count} | ${String(c.summary).replace(/\|/g, "\\|")} |`);
              }
            '
            echo
            echo '### Reports'
            for f in data/reports/*.md; do
              echo "- [\`$(basename "$f")\`]($f)"
            done
            echo
            echo '_Opened automatically by `.github/workflows/pipeline.yml`. Review the divergence reports before merging._'
            echo 'PR_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/nightly-refresh
          base: main
          commit-message: "data: nightly refresh ${{ github.run_id }}"
          title: "data: nightly refresh ${{ github.run_id }}"
          body: ${{ steps.summary.outputs.body }}
          add-paths: data
          delete-branch: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: data/reports/
          if-no-files-found: warn

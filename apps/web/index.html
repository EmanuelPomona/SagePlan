      The privacy promise, enforced by the browser rather than by our good
      intentions: the app may talk to its own origin and nowhere else, so a
      student's record cannot leave this page even by accident.
    -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"

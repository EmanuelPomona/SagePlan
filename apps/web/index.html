<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The privacy promise, enforced by the browser rather than by our good
      intentions: the app may talk to its own origin and nowhere else, so a
      student's record cannot leave this page even by accident.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="An unofficial, browser-local view of your Pomona College general education requirements."
    />
    <title>Pomona GradGuide (unofficial)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

openapi: 3.1.0
info:
  title: Pomona GradGuide static data contract
  version: 0.1.0
  description: |-
    GENERATED by `npm run contract:openapi` from packages/shared. Do not edit by hand.

    There is no runtime server. These paths are static JSON files emitted by the pipeline into /data and served by the web app from its own origin. The web app never sends student data anywhere; the only requests it makes are GETs of these paths. scripts/contract-test.sh validates the files on disk against these schemas.
servers:
  - url: http://localhost:{port}
    description: Vite dev server (FRONTEND_PORT from .env)
    variables:
      port:
        default: "3000"
paths:
  /data/manifest.json:
    get:
      summary: Artefact manifest
      description: First request the app makes. Lists every artefact, its freshness and the terms available.
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
  /data/catalog.json:
    get:
      summary: Course catalog
      description: Every Pomona course in the catalog year with its GE attributes. Stable; rebuilt per catalog year.
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogArtefact"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
  /data/sections-{term}.json:
    get:
      summary: Sections for one term
      description: Live per-term section data from Hyperschedule, rebuilt nightly. One file per term listed in manifest.upcomingTerms.
      parameters:
        - name: term
          in: path
          required: true
          schema:
            type: string
            pattern: ^(FA|SP)\d{4}$
          description: Term code, e.g. "SP2027".
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionsArtefact"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
  /data/offering-history.json:
    get:
      summary: Offering history
      description: Every term each course has run since ~2012. Powers the term ribbon.
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingHistoryArtefact"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
  /data/programs/{programId}.json:
    get:
      summary: Program (requirements as data)
      description: Hand-written, reviewed requirement set. general-education-2026 in P0; majors and minors later, same shape.
      parameters:
        - name: programId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9-]+$
          description: Program id from manifest.programs.
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
  /data/external-credit-rules.json:
    get:
      summary: External credit rules
      description: AP / IB / A-Level / SAT-II thresholds -> credits and granted attributes.
      responses:
        "200":
          description: The artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCreditRules"
        "404":
          description: Not generated (yet). The app must render a specific error state, never a blank page.
components:
  schemas:
    Affiliation:
      type: string
      pattern: ^[A-Z]{2,3}$
      description: Campus / affiliation code as used by Hyperschedule and the Registrar (PO, HM, SC, CM, PZ, AF, KS, JP, CH, JT, AA, JM, BK). EXT marks a course from an external institution that is not in the catalog (transfer, or non-Pomona study abroad).
      title: Affiliation
    CourseId:
      type: object
      properties:
        department:
          type: string
          pattern: ^[A-Z]{2,5}$
          description: Subject code, e.g. "CSCI". Also the department that offers the course for Breadth purposes.
        courseNumber:
          type: integer
          minimum: 0
          maximum: 999
          description: Numeric part of the course number, e.g. 62.
        suffix:
          type: string
          pattern: ^[A-Z0-9]{0,3}$
          description: Letter suffix, e.g. "A", or "" when none.
        affiliation:
          $ref: "#/components/schemas/Affiliation"
      required:
        - department
        - courseNumber
        - suffix
        - affiliation
      additionalProperties: false
      description: 'Decomposed course identity. Canonical string form is courseKey(): "CSCI 062A PO".'
      title: CourseId
    TermSeason:
      type: string
      enum:
        - FA
        - SP
      title: TermSeason
    TermId:
      type: object
      properties:
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          description: Calendar year in which the term starts (FA2026 starts in 2026; SP2027 starts in 2027).
        term:
          $ref: "#/components/schemas/TermSeason"
      required:
        - year
        - term
      additionalProperties: false
      description: 'Academic term. Canonical string form is termCode(): "FA2026".'
      title: TermId
    TermCode:
      type: string
      pattern: ^(FA|SP)\d{4}$
      description: 'Term as a string, Hyperschedule style: "FA2026", "SP2027". Used in artefact file names.'
      title: TermCode
    CatalogYear:
      type: string
      pattern: ^\d{4}-\d{4}$
      description: Catalog edition, e.g. "2026-2027".
      title: CatalogYear
    GeAttribute:
      type: string
      enum:
        - AREA_1
        - AREA_2
        - AREA_3
        - AREA_4
        - AREA_5
        - AREA_6
        - WRITING_INTENSIVE
        - SPEAKING_INTENSIVE
        - ANALYZING_DIFFERENCE
        - LANGUAGE
        - PHYSICAL_EDUCATION
        - COMMUNITY_PARTNERSHIP
      description: Pomona general-education attribute a course carries, as tagged by the Registrar. Hyperschedule codes 1A1..1A6, 1WIR, 1SIR, 1ADR, 1FL, 1PE, 1CP map onto these.
      title: GeAttribute
    Provenance:
      type: string
      enum:
        - pomona
        - claremont
        - abroad
        - transfer
      description: "Where a completed course was taken. pomona: Pomona College. claremont: another Claremont College via cross-registration. abroad: a Pomona-run or Pomona-approved external study program. transfer: work at another institution posted as transfer credit."
      title: Provenance
    StudentType:
      type: string
      enum:
        - firstYear
        - transfer
      title: StudentType
    CourseFilter:
      type: object
      properties:
        provenance:
          description: Only completed courses with one of these provenances count.
          type: array
          items:
            $ref: "#/components/schemas/Provenance"
        attributes:
          description: Only courses carrying ALL of these attributes count.
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
        minTerm:
          description: Only courses taken in this term or later count.
          $ref: "#/components/schemas/TermId"
        sinceMatriculation:
          description: Only courses taken in or after the student's matriculationTerm count. External (exam) credit never counts under this filter.
          type: boolean
        transferPolicy:
          description: "How provenance=transfer courses are treated when `provenance` would otherwise exclude them. transferStudentsPreMatriculation: they count only for studentType=transfer and only when taken before matriculationTerm (the Breadth/overlay rule for transfer students)."
          type: string
          enum:
            - never
            - transferStudentsPreMatriculation
        partialCredit:
          description: Whether courses worth less than one credit count. Default include.
          type: string
          enum:
            - include
            - exclude
      additionalProperties: false
      description: Narrows which completed courses a rule may count. All present fields must hold (AND).
      title: CourseFilter
    CourseSetRef:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: A named, versioned predicate, e.g. "upper-division-csci".
        department:
          type: string
        numberMin:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        numberMax:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        affiliation:
          type: array
          items:
            type: string
        excludeNumbers:
          description: Inclusive ranges to drop, e.g. [[190,199]] to exclude senior exercises.
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              - type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
            items: false
            minItems: 2
            maxItems: 2
      required:
        - id
      additionalProperties: false
      description: A named course-set predicate. Defined once, reused. Not an inline blob. Used by fromSet (deferred to P1).
      title: CourseSetRef
    CreditCaps:
      type: object
      properties:
        advancedStandingCredits:
          description: "Max AP/IB/A-Level credits counted (catalog: 2)."
          type: number
          minimum: 0
        externalCredits:
          description: "Max credits from work outside The Claremont Colleges, transfer AND advanced standing combined (catalog: 16)."
          type: number
          minimum: 0
        partialCreditCourseCredits:
          description: "Max total credits from cumulative (partial-credit) courses (catalog: 2)."
          type: number
          minimum: 0
        partialCreditCourses:
          description: "Max number of cumulative courses counted (catalog: 8)."
          type: integer
          minimum: 0
          maximum: 9007199254740991
      additionalProperties: false
      description: Caps applied while summing credits. Data, so the catalog's limits live in the program JSON.
      title: CreditCaps
    Rule:
      description: Requirement rule. Discriminated on `kind`. P0 evaluates course, attribute, credits, gpa, attested; the rest return unverifiable.
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: course
            course:
              $ref: "#/components/schemas/CourseId"
            minGrade:
              description: 'Minimum letter grade, e.g. "C-". Absent: any passing grade or CR/P.'
              type: string
          required:
            - kind
            - course
          additionalProperties: false
          description: P0. Satisfied when the student completed exactly this course.
        - type: object
          properties:
            kind:
              type: string
              const: attribute
            attr:
              $ref: "#/components/schemas/GeAttribute"
            n:
              type: number
              minimum: 0
            unit:
              description: Count courses (default) or sum their credits (Area 6 partial-credit combinations).
              type: string
              enum:
                - courses
                - credits
            filter:
              $ref: "#/components/schemas/CourseFilter"
            distinctTerms:
              description: The counted courses must be from different terms (Physical Education).
              type: boolean
          required:
            - kind
            - attr
            - n
          additionalProperties: false
          description: P0. Satisfied by n completed courses carrying the attribute, or by attributes granted through qualifying external credit.
        - type: object
          properties:
            kind:
              type: string
              const: credits
            n:
              type: number
              minimum: 0
            filter:
              $ref: "#/components/schemas/CourseFilter"
            includeExternal:
              description: "Whether exam (advanced standing) credits count. Default: true when no filter is present, false otherwise."
              type: boolean
            caps:
              $ref: "#/components/schemas/CreditCaps"
          required:
            - kind
            - n
          additionalProperties: false
          description: P0. Satisfied when the summed credits of qualifying completed courses (plus external credit when included, subject to caps) reach n.
        - type: object
          properties:
            kind:
              type: string
              const: gpa
            min:
              type: number
              minimum: 0
              maximum: 4
            scope:
              type: string
              enum:
                - overall
                - program
          required:
            - kind
            - min
            - scope
          additionalProperties: false
          description: P0. GPA over letter-graded courses with provenance pomona, claremont or abroad. CR/NC, P/NP and transfer grades are excluded.
        - type: object
          properties:
            kind:
              type: string
              const: attested
            id:
              type: string
              minLength: 1
            prompt:
              type: string
              minLength: 1
          required:
            - kind
            - id
            - prompt
          additionalProperties: false
          description: P0. Satisfied when plan.attestations[id] is true; otherwise unverifiable with the prompt surfaced.
        - type: object
          properties:
            kind:
              type: string
              const: allOf
            rules:
              type: array
              items:
                $ref: "#/components/schemas/Rule"
          required:
            - kind
            - rules
          additionalProperties: false
          description: DEFERRED to P1. Returns unverifiable in P0.
        - type: object
          properties:
            kind:
              type: string
              const: anyOf
            rules:
              type: array
              items:
                $ref: "#/components/schemas/Rule"
          required:
            - kind
            - rules
          additionalProperties: false
          description: DEFERRED to P1. Returns unverifiable in P0.
        - type: object
          properties:
            kind:
              type: string
              const: chooseN
            n:
              type: number
              minimum: 0
            unit:
              type: string
              enum:
                - courses
                - credits
            rules:
              type: array
              items:
                $ref: "#/components/schemas/Rule"
          required:
            - kind
            - n
            - unit
            - rules
          additionalProperties: false
          description: DEFERRED to P1.
        - type: object
          properties:
            kind:
              type: string
              const: fromSet
            n:
              type: number
              minimum: 0
            set:
              $ref: "#/components/schemas/CourseSetRef"
          required:
            - kind
            - n
            - set
          additionalProperties: false
          description: DEFERRED to P1.
        - type: object
          properties:
            kind:
              type: string
              const: milestone
            id:
              type: string
              minLength: 1
            label:
              type: string
              minLength: 1
          required:
            - kind
            - id
            - label
          additionalProperties: false
          description: DEFERRED to P1.
        - type: object
          properties:
            kind:
              type: string
              const: not
            rule:
              $ref: "#/components/schemas/Rule"
          required:
            - kind
            - rule
          additionalProperties: false
          description: DEFERRED to P1.
      title: Rule
    OverlapPolicy:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: allowAll
          required:
            - kind
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: allowOnly
            requirementIds:
              type: array
              items:
                type: string
          required:
            - kind
            - requirementIds
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: denyOnly
            requirementIds:
              type: array
              items:
                type: string
          required:
            - kind
            - requirementIds
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: exclusive
          required:
            - kind
          additionalProperties: false
      description: Which other requirements may reuse a course already counted here. Enforced during assignment, not filtered afterwards. Default allowAll.
      title: OverlapPolicy
    Course:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/CourseId"
        title:
          type: string
          minLength: 1
        description:
          type: string
        department:
          type: string
          description: Offering department name as Coursedog reports it, e.g. "Computer Science".
        credits:
          type: object
          properties:
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            repeatable:
              type: boolean
            maxRepeats:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - min
            - max
            - repeatable
            - maxRepeats
          additionalProperties: false
          description: Structured credit value. Handles 0.25 PE and 0.5 half-courses.
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
          description: GE attributes the Registrar tagged. Already reflects the catalog's eligibility exclusions; the engine adds no exclusion logic.
        gradeMode:
          type: string
        prereqText:
          description: Verbatim prose. Display only. Never parsed for enforcement.
          type:
            - string
            - "null"
        prereqRule:
          anyOf:
            - $ref: "#/components/schemas/Rule"
            - type: "null"
          description: Only the ~5% of courses with structured requisites. Advisory only.
        catalogYear:
          $ref: "#/components/schemas/CatalogYear"
        sourceUrl:
          type: string
          format: uri
        lastVerified:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - id
        - title
        - description
        - department
        - credits
        - attributes
        - gradeMode
        - prereqText
        - prereqRule
        - catalogYear
        - sourceUrl
        - lastVerified
      additionalProperties: false
      title: Course
    Meeting:
      type: object
      properties:
        days:
          type: array
          items:
            type: string
          description: Day letters as Hyperschedule reports them, e.g. ["M","W"].
        startSec:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Seconds after midnight.
        endSec:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        location:
          type: string
      required:
        - days
        - startSec
        - endSec
        - location
      additionalProperties: false
      title: Meeting
    Section:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/CourseId"
        sectionNumber:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        term:
          $ref: "#/components/schemas/TermId"
        half:
          description: '"F"/"S" for half-semester sections, else null.'
          type:
            - string
            - "null"
        instructors:
          type: array
          items:
            type: string
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
        seatsTotal:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        seatsFilled:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        permCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          type: string
          description: Hyperschedule status, e.g. "open", "closed", "reopened".
        geCodes:
          type: array
          items:
            type: string
          description: Raw Hyperschedule course-area codes for this section, e.g. ["1A3","1ADR"]. Pipeline cross-checks these against catalog attributes.
      required:
        - course
        - sectionNumber
        - term
        - half
        - instructors
        - meetings
        - seatsTotal
        - seatsFilled
        - permCount
        - status
        - geCodes
      additionalProperties: false
      title: Section
    OfferingHistory:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/CourseId"
        terms:
          type: array
          items:
            $ref: "#/components/schemas/TermId"
          description: Every term the course has been offered, ascending, back to ~2012.
      required:
        - course
        - terms
      additionalProperties: false
      title: OfferingHistory
    Confidence:
      type: string
      enum:
        - verified
        - draft
        - unverified
      description: "verified: rule text checked against the catalog and cross-checked. draft: encoded from the catalog but with an interpretation the Registrar has not confirmed. unverified: encoded from a secondary source."
      title: Confidence
    SourceRef:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          description: Snapshot slug under data/sources/catalog-pages/, whose text must contain sourceQuote verbatim (whitespace-normalised).
        url:
          type: string
          format: uri
      required:
        - slug
        - url
      additionalProperties: false
      title: SourceRef
    Requirement:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]+$
        label:
          type: string
          minLength: 1
          description: '"Breadth Area 3"'
        explanation:
          type: string
          minLength: 1
          description: User-facing plain English in the tool's own voice.
        sourceQuote:
          type: string
          minLength: 1
          description: VERBATIM catalog text. Always rendered beside the result. Validated as a substring of the referenced snapshot.
        sourceRef:
          $ref: "#/components/schemas/SourceRef"
        rule:
          $ref: "#/components/schemas/Rule"
        overlapPolicy:
          $ref: "#/components/schemas/OverlapPolicy"
        appliesWhen:
          description: Applicability, as data. A requirement that does not apply to the student is reported satisfied with waived=true.
          type: object
          properties:
            studentType:
              type: array
              items:
                $ref: "#/components/schemas/StudentType"
          additionalProperties: false
        attestable:
          description: "Escape hatch: the student may self-certify this requirement is met another way. Result carries viaAttestation=true and is rendered as a manual result."
          type: object
          properties:
            prompt:
              type: string
              minLength: 1
          required:
            - prompt
          additionalProperties: false
        confidence:
          description: Overrides the program-level confidence for this requirement.
          $ref: "#/components/schemas/Confidence"
        grantedByAttributes:
          description: "Informational: which granted external-credit attributes can satisfy this requirement (the attribute rule already handles it)."
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
      required:
        - id
        - label
        - explanation
        - sourceQuote
        - sourceRef
        - rule
        - overlapPolicy
      additionalProperties: false
      title: Requirement
    ProgramConstraint:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: distinctDepartments
            requirementIds:
              minItems: 2
              type: array
              items:
                type: string
            explanation:
              type: string
              minLength: 1
            sourceQuote:
              type: string
              minLength: 1
            sourceRef:
              $ref: "#/components/schemas/SourceRef"
          required:
            - kind
            - requirementIds
            - explanation
            - sourceQuote
            - sourceRef
          additionalProperties: false
          description: "Courses assigned to these requirements must come from pairwise different departments (CourseId.department). Catalog: no two Breadth areas from the same department."
      description: A cross-requirement constraint enforced during assignment. Data, not code.
      title: ProgramConstraint
    Advisory:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]+$
        label:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
          description: Plain-English advisory shown to the student. Not evaluated.
        sourceQuote:
          type: string
          minLength: 1
        sourceRef:
          $ref: "#/components/schemas/SourceRef"
      required:
        - id
        - label
        - text
        - sourceQuote
        - sourceRef
      additionalProperties: false
      description: A rule the engine does not evaluate in P0 (needs term-sequence reasoning or is a recommendation). Rendered as a note.
      title: Advisory
    Program:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]+$
          description: '"general-education-2026"'
        name:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - general-education
            - major
            - minor
        catalogYear:
          $ref: "#/components/schemas/CatalogYear"
        requirements:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/ProgramConstraint"
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/Advisory"
        confidence:
          $ref: "#/components/schemas/Confidence"
        sourceUrl:
          type: string
          format: uri
        encodedBy:
          type: string
          minLength: 1
        encodedOn:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        notes:
          type: string
      required:
        - id
        - name
        - kind
        - catalogYear
        - requirements
        - confidence
        - sourceUrl
        - encodedBy
        - encodedOn
        - notes
      additionalProperties: false
      description: A set of requirements. General education, a major and a minor are all this type.
      title: Program
    GradeMode:
      type: string
      enum:
        - letter
        - creditNoCredit
        - passNoPass
      title: GradeMode
    CompletedCourse:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/CourseId"
        term:
          anyOf:
            - $ref: "#/components/schemas/TermId"
            - type: "null"
          description: "When the course was taken, or null when the student has not recorded it. Entering terms is optional by design: a rule that needs a term is evaluated both with and without the unknown-term courses, and reports unverifiable only when the two disagree. See docs/API.md 2.7."
        grade:
          description: '"A-", "CR", "P", "IP" (in progress), or null when not recorded. null is treated as PASSED, so a course the student did not pass must carry its grade. Letter grades feed a gpa rule; CR/P/NC/NP do not.'
          type:
            - string
            - "null"
        gradeMode:
          anyOf:
            - $ref: "#/components/schemas/GradeMode"
            - type: "null"
          description: null when not recorded.
        provenance:
          $ref: "#/components/schemas/Provenance"
        title:
          description: Required when the course is not in the catalog (transfer or non-Pomona abroad).
          type: string
        credits:
          description: Overrides the catalog credit value; required when the course is not in the catalog.
          type: number
          minimum: 0
        attributes:
          description: Overrides catalog attributes. Meaningful for transfer students' pre-matriculation Breadth/overlay awards.
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
      required:
        - course
        - term
        - grade
        - gradeMode
        - provenance
      additionalProperties: false
      title: CompletedCourse
    PlannedCourse:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/CourseId"
        term:
          $ref: "#/components/schemas/TermId"
      required:
        - course
        - term
      additionalProperties: false
      description: Reserved for the P2 planner. Empty in P0.
      title: PlannedCourse
    ExamKind:
      type: string
      enum:
        - AP
        - IB
        - ALEVEL
        - SATII
      description: "Transfer coursework is NOT an exam: enter it as CompletedCourse with provenance=transfer."
      title: ExamKind
    IbLevel:
      type: string
      enum:
        - HL
        - SL
      title: IbLevel
    ExternalCreditInput:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ExamKind"
        subjectKey:
          type: string
          minLength: 1
          description: Key of an ExamSubject in data/external-credit-rules.json.
        score:
          description: AP 1-5, IB 1-7, SAT-II 200-800. null for letter-graded exams.
          type:
            - number
            - "null"
        grade:
          description: 'Letter-graded exams (A-Level: "A*", "A", "B", ...). null otherwise.'
          type:
            - string
            - "null"
        level:
          anyOf:
            - $ref: "#/components/schemas/IbLevel"
            - type: "null"
          description: IB only.
      required:
        - kind
        - subjectKey
        - score
        - grade
        - level
      additionalProperties: false
      description: What the student enters. resolveExternalCredit() turns it into an ExternalCredit.
      title: ExternalCreditInput
    ExternalCredit:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ExamKind"
        subjectKey:
          type: string
          minLength: 1
          description: Key of an ExamSubject in data/external-credit-rules.json.
        score:
          description: AP 1-5, IB 1-7, SAT-II 200-800. null for letter-graded exams.
          type:
            - number
            - "null"
        grade:
          description: 'Letter-graded exams (A-Level: "A*", "A", "B", ...). null otherwise.'
          type:
            - string
            - "null"
        level:
          anyOf:
            - $ref: "#/components/schemas/IbLevel"
            - type: "null"
          description: IB only.
        label:
          type: string
          minLength: 1
          description: '"AP French Language and Culture"'
        credits:
          type: number
          minimum: 0
          description: Advanced standing credit awarded by the rules table, before caps. 0 when the score does not qualify.
        grantsAttributes:
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
          description: GE attributes this exam satisfies, e.g. ["LANGUAGE"].
        qualifies:
          type: boolean
          description: credits > 0 or grantsAttributes non-empty.
        duplicateKey:
          type: string
          description: Exams sharing this key duplicate each other (AP and IB English Literature); only one earns credit.
        ruleIds:
          type: array
          items:
            type: string
          description: Ids of the rules in external-credit-rules.json that fired.
        notes:
          type: array
          items:
            type: string
      required:
        - kind
        - subjectKey
        - score
        - grade
        - level
        - label
        - credits
        - grantsAttributes
        - qualifies
        - duplicateKey
        - ruleIds
        - notes
      additionalProperties: false
      title: ExternalCredit
    Override:
      type: object
      properties:
        requirementId:
          type: string
          minLength: 1
        course:
          $ref: "#/components/schemas/CourseId"
        reason:
          type: string
          minLength: 1
        approvedBy:
          type: string
          minLength: 1
          description: Chair or dean who granted it. Rendered beside the result.
      required:
        - requirementId
        - course
        - reason
        - approvedBy
      additionalProperties: false
      description: Chair-granted substitution. Invisible to every data source, so manual. Marks the requirement satisfied by that course regardless of the rule; viaOverride=true.
      title: Override
    StudentPlan:
      type: object
      properties:
        schemaVersion:
          type: number
          const: 1
          description: Bump when the shape changes; the app migrates older plans on import.
        catalogYear:
          $ref: "#/components/schemas/CatalogYear"
        matriculationTerm:
          anyOf:
            - $ref: "#/components/schemas/TermId"
            - type: "null"
          description: null when the student has not recorded it. The engine then infers it as the earliest known completed-course term, and falls back to bounded evaluation (docs/API.md 2.7) where the inference would change an answer.
        studentType:
          $ref: "#/components/schemas/StudentType"
        completed:
          type: array
          items:
            $ref: "#/components/schemas/CompletedCourse"
        planned:
          type: array
          items:
            $ref: "#/components/schemas/PlannedCourse"
        externalCredits:
          type: array
          items:
            $ref: "#/components/schemas/ExternalCredit"
        attestations:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: boolean
          description: requirementId (or attested rule id) -> student confirmed.
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/Override"
        declarations:
          type: array
          items:
            type: object
            properties:
              programId:
                type: string
                minLength: 1
              kind:
                type: string
                enum:
                  - major
                  - minor
            required:
              - programId
              - kind
            additionalProperties: false
          description: Empty in P0.
      required:
        - schemaVersion
        - catalogYear
        - matriculationTerm
        - studentType
        - completed
        - planned
        - externalCredits
        - attestations
        - overrides
        - declarations
      additionalProperties: false
      description: Everything the student has told the app. Persisted in localStorage, exported as JSON, shared in a URL fragment. Never transmitted.
      title: StudentPlan
    RequirementStatus:
      type: string
      enum:
        - satisfied
        - partial
        - unmet
        - unverifiable
      description: "unverifiable is a first-class status, never an error: an unimplemented rule kind, an unconfirmed attestation, or a rule whose text could not be encoded."
      title: RequirementStatus
    Result:
      description: The engine's verdict for one requirement. One per requirement per evaluated program, in program order.
      type: object
      properties:
        programId:
          type: string
          minLength: 1
        requirementId:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/RequirementStatus"
        satisfiedBy:
          type: array
          items:
            $ref: "#/components/schemas/CourseId"
          description: The actual assignment chosen. Empty for unmet, for gpa, and for waived.
        remaining:
          anyOf:
            - type: object
              properties:
                n:
                  type: number
                  minimum: 0
                unit:
                  type: string
                  enum:
                    - courses
                    - credits
              required:
                - n
                - unit
              additionalProperties: false
            - type: "null"
          description: How much is still owed, when the rule counts something. null for gpa, course, attested.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CourseId"
          description: Catalog courses that could satisfy this requirement and are not yet used. Powers "What satisfies this?". The UI intersects with sections-{term}.
        children:
          type: array
          items:
            $ref: "#/components/schemas/Result"
        viaOverride:
          type: boolean
        viaAttestation:
          type: boolean
        waived:
          description: The requirement does not apply to this student (appliesWhen). Reported satisfied.
          type: boolean
        confidence:
          description: Copied from the requirement or program so the UI can flag draft encodings.
          $ref: "#/components/schemas/Confidence"
        note:
          description: e.g. "rule kind 'chooseN' not yet supported", or a constraint violation.
          type: string
        violations:
          description: Program constraint ids this assignment violates, if any.
          type: array
          items:
            type: string
      required:
        - programId
        - requirementId
        - status
        - satisfiedBy
        - remaining
        - candidates
        - children
      additionalProperties: false
      title: Result
    ArtefactMeta:
      type: object
      properties:
        schemaVersion:
          type: number
          const: 1
        generator:
          type: string
          minLength: 1
          description: '"@sageplan/pipeline@0.1.0 catalog"'
        generatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          description: When this file was written. The UI shows 'data as of'.
        fetchedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$

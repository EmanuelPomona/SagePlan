          items:
            $ref: "#/components/schemas/OfferingHistory"
      required:
        - meta
        - asOfTerm
        - knownTerms
        - history
      additionalProperties: false
      description: data/offering-history.json
      title: OfferingHistoryArtefact
    Manifest:
      type: object
      properties:
        schemaVersion:
          type: number
          const: 1
        generatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        catalogYear:
          description: The catalog year the data describes. The UI compares it with today's date for the staleness banner.
          $ref: "#/components/schemas/CatalogYear"
        catalog:
          type: object
          properties:
            path:
              type: string
            fetchedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            courseCount:
              type: integer
              minimum: 1
              maximum: 9007199254740991
          required:
            - path
            - fetchedAt
            - courseCount
          additionalProperties: false
        sections:
          type: array
          items:
            type: object
            properties:
              term:
                $ref: "#/components/schemas/TermCode"
              path:
                type: string
              fetchedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              sectionCount:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - term
              - path
              - fetchedAt
              - sectionCount
            additionalProperties: false
        offeringHistory:
          anyOf:
            - type: object
              properties:
                path:
                  type: string
                fetchedAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                courseCount:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
              required:
                - path
                - fetchedAt
                - courseCount
              additionalProperties: false
            - type: "null"
        programs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              path:
                type: string
              kind:
                type: string
                enum:
                  - general-education
                  - major
                  - minor
              name:
                type: string
              confidence:
                $ref: "#/components/schemas/Confidence"
            required:
              - id
              - path
              - kind
              - name
              - confidence
            additionalProperties: false
        externalCreditRules:
          type: object
          properties:
            path:
              type: string
          required:
            - path
          additionalProperties: false
        upcomingTerms:
          type: array
          items:
            $ref: "#/components/schemas/TermCode"
          description: Terms the UI offers in "What satisfies this?", ascending. Every entry has a sections file.
      required:
        - schemaVersion
        - generatedAt
        - catalogYear
        - catalog
        - sections
        - offeringHistory
        - programs
        - externalCreditRules
        - upcomingTerms
      additionalProperties: false
      description: data/manifest.json. The first file the app loads. Lists every artefact, its freshness, and the terms available.
      title: Manifest
    ExamSubject:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z0-9-]+$
          description: '"ap-spanish-language"'
        kind:
          $ref: "#/components/schemas/ExamKind"
        label:
          type: string
          minLength: 1
        category:
          type: string
          enum:
            - language
            - other
          description: "language: a language other than English; drives LANGUAGE attribute rules."
        duration:
          type: string
          enum:
            - year
            - semester
          description: Year-long exams earn 1 credit, semester-long 0.5 (when they qualify).
        duplicateKey:
          type: string
          minLength: 1
          description: 'Exams that duplicate each other share it: "english-literature" for AP and IB English Literature.'
        ibGroup:
          anyOf:
            - type: string
              enum:
                - A
                - B
            - type: "null"
          description: "IB language exams: Language A (literature / language and literature) or Language B (acquisition). null for non-IB."
        romanizedScript:
          description: SAT-II exams that test in Romanized writing (Chinese, Japanese, Korean) do not satisfy the language requirement.
          type: boolean
      required:
        - key
        - kind
        - label
        - category
        - duration
        - duplicateKey
        - ibGroup
      additionalProperties: false
      title: ExamSubject
    ExamMatch:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ExamKind"
        category:
          type: string
          enum:
            - language
            - other
        ibGroup:
          type: string
          enum:
            - A
            - B
        levels:
          description: "IB: which levels this rule accepts."
          type: array
          items:
            $ref: "#/components/schemas/IbLevel"
        minScore:
          type: number
        minGrade:
          description: 'Letter-graded exams: minimum grade on gradeScale, e.g. "B".'
          type: string
        gradeScale:
          description: Highest first, e.g. ["A*","A","B","C","D","E"].
          type: array
          items:
            type: string
        excludeRomanizedScript:
          type: boolean
        subjectKeys:
          description: Restrict to specific subjects.
          type: array
          items:
            type: string
        excludeSubjectKeys:
          description: Never match these subjects (A-Level language path excludes Chinese and Japanese).
          type: array
          items:
            type: string
      additionalProperties: false
      description: All present fields must match (AND).
      title: ExamMatch
    ExternalCreditRule:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]+$
        effect:
          type: string
          enum:
            - credit
            - attribute
          description: "credit: award advanced standing credit by duration. attribute: grant GE attributes (satisfies a requirement without credit)."
        match:
          $ref: "#/components/schemas/ExamMatch"
        grantsAttributes:
          description: For effect=attribute.
          type: array
          items:
            $ref: "#/components/schemas/GeAttribute"
        explanation:
          type: string
          minLength: 1
        sourceQuote:
          type: string
          minLength: 1
        sourceRef:
          $ref: "#/components/schemas/SourceRef"
        confidence:
          $ref: "#/components/schemas/Confidence"
      required:
        - id
        - effect
        - match
        - explanation
        - sourceQuote
        - sourceRef
        - confidence
      additionalProperties: false
      title: ExternalCreditRule
    ExternalCreditRules:
      type: object
      properties:
        schemaVersion:
          type: number
          const: 1
        catalogYear:
          $ref: "#/components/schemas/CatalogYear"
        subjects:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ExamSubject"
        rules:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ExternalCreditRule"
        caps:
          type: object
          properties:
            advancedStandingCredits:
              type: number
              minimum: 0
            externalCredits:
              type: number
              minimum: 0

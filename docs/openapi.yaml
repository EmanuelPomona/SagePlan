            - externalCredits
          additionalProperties: false
          description: Mirrors the credits-rule caps in the GE program; kept here so resolveExternalCredit can warn at entry time.
        encodedBy:
          type: string
          minLength: 1
        encodedOn:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        notes:
          type: string
      required:
        - schemaVersion
        - catalogYear
        - subjects
        - rules
        - caps
        - encodedBy
        - encodedOn
        - notes
      additionalProperties: false
      description: data/external-credit-rules.json. Hand-written. Exam thresholds -> credits and granted attributes.
      title: ExternalCreditRules
    ValidationCheck:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - pass
            - warn
            - fail
        summary:
          type: string
        count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        details:
          type: array
          items:
            type: string
      required:
        - id
        - status
        - summary
        - count
        - details
      additionalProperties: false
      title: ValidationCheck
    ValidationReport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        generator:
          type: string
          minLength: 1
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
        ok:
          type: boolean
          description: false when any check failed.
      required:
        - generatedAt
        - generator
        - checks
        - ok
      additionalProperties: false
      description: data/reports/validation.json. For humans and CI, never loaded by the app.
      title: ValidationReport
x-engine-contract:
  description: Pure functions exported by @sageplan/engine. Not HTTP. Documented in docs/API.md §Engine contract.
  evaluate: "evaluate(plan: StudentPlan, programs: Program[], catalog: Course[]): Result[]"
  resolveExternalCredit: "resolveExternalCredit(input: ExternalCreditInput, rules: ExternalCreditRules): ExternalCredit"
